services:
  - type: worker
    name: trading-hub-alert-worker
    env: node
    rootDir: .
    plan: starter
    buildCommand: npm install
    startCommand: npm run worker:alerts
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ALERT_WORKER_SYNC_MS
        value: "15000"
      - key: ALERT_WORKER_REST_CHECK_MS
        value: "3000"

